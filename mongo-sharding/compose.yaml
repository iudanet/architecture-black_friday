---
name: mongo-sharding

services:
  configSrv:
    image: mongo:8.2
    container_name: configSrv
    restart: always
    ports:
      - "${CONFIG_SRV_PORT:-27017}:27017"
    networks:
      app-network:
    volumes:
      - config-data:/data/db
    command:
      - "--configsvr"
      - "--replSet"
      - "config_server"
      - "--bind_ip_all"
      - "--port"
      - "27017"

  shard1:
    image: mongo:8.2
    container_name: shard1
    restart: always
    ports:
      - "${SHARD1_PORT:-27018}:27018"
    networks:
      app-network:
    volumes:
      - shard1-data:/data/db
    command:
      - "--shardsvr"
      - "--replSet"
      - "shard1"
      - "--bind_ip_all"
      - "--port"
      - "27018"

  shard2:
    image: mongo:8.2
    container_name: shard2
    restart: always
    ports:
      - "${SHARD2_PORT:-27019}:27019"
    networks:
      app-network:
    volumes:
      - shard2-data:/data/db
    command:
      - "--shardsvr"
      - "--replSet"
      - "shard2"
      - "--bind_ip_all"
      - "--port"
      - "27019"

  mongos_router:
    image: mongo:8.2
    container_name: mongos_router
    restart: always
    ports:
      - "${MONGOS_PORT:-27020}:27020"
    networks:
      app-network:
    depends_on:
      - configSrv
      - shard1
      - shard2
    command:
      - "mongos"
      - "--configdb"
      - "config_server/configSrv:27017"
      - "--bind_ip_all"
      - "--port"
      - "27020"

  pymongo_api:
    image: kazhem/pymongo_api:1.0.0
    container_name: pymongo_api
    depends_on:
      - mongos_router
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      app-network:
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"

networks:
  app-network:
    driver: bridge

volumes:
  config-data:
  shard1-data:
  shard2-data:
