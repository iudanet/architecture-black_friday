---
name: mongo-sharding-repl

services:
  configSrv1:
    image: mongo:8.2
    container_name: configSrv1
    restart: always
    ports:
      - "${CONFIG_SRV1_PORT:-27017}:27017"
    networks:
      app-network:
    volumes:
      - config-data1:/data/db
    command:
      - "--configsvr"
      - "--replSet"
      - "config_server"
      - "--bind_ip_all"
      - "--port"
      - "27017"

  configSrv2:
    image: mongo:8.2
    container_name: configSrv2
    restart: always
    ports:
      - "${CONFIG_SRV2_PORT:-27027}:27017"
    networks:
      app-network:
    volumes:
      - config-data2:/data/db
    command:
      - "--configsvr"
      - "--replSet"
      - "config_server"
      - "--bind_ip_all"
      - "--port"
      - "27017"

  configSrv3:
    image: mongo:8.2
    container_name: configSrv3
    restart: always
    ports:
      - "${CONFIG_SRV3_PORT:-27037}:27017"
    networks:
      app-network:
    volumes:
      - config-data3:/data/db
    command:
      - "--configsvr"
      - "--replSet"
      - "config_server"
      - "--bind_ip_all"
      - "--port"
      - "27017"

  shard1-1:
    image: mongo:8.2
    container_name: shard1-1
    restart: always
    ports:
      - "${SHARD1_1_PORT:-27018}:27018"
    networks:
      app-network:
    volumes:
      - shard1-1-data:/data/db
    command:
      - "--shardsvr"
      - "--replSet"
      - "shard1"
      - "--bind_ip_all"
      - "--port"
      - "27018"

  shard1-2:
    image: mongo:8.2
    container_name: shard1-2
    restart: always
    ports:
      - "${SHARD1_2_PORT:-27028}:27018"
    networks:
      app-network:
    volumes:
      - shard1-2-data:/data/db
    command:
      - "--shardsvr"
      - "--replSet"
      - "shard1"
      - "--bind_ip_all"
      - "--port"
      - "27018"

  shard1-3:
    image: mongo:8.2
    container_name: shard1-3
    restart: always
    ports:
      - "${SHARD1_3_PORT:-27038}:27018"
    networks:
      app-network:
    volumes:
      - shard1-3-data:/data/db
    command:
      - "--shardsvr"
      - "--replSet"
      - "shard1"
      - "--bind_ip_all"
      - "--port"
      - "27018"

  shard2-1:
    image: mongo:8.2
    container_name: shard2-1
    restart: always
    ports:
      - "${SHARD2_1_PORT:-27019}:27019"
    networks:
      app-network:
    volumes:
      - shard2-1-data:/data/db
    command:
      - "--shardsvr"
      - "--replSet"
      - "shard2"
      - "--bind_ip_all"
      - "--port"
      - "27019"

  shard2-2:
    image: mongo:8.2
    container_name: shard2-2
    restart: always
    ports:
      - "${SHARD2_2_PORT:-27029}:27019"
    networks:
      app-network:
    volumes:
      - shard2-2-data:/data/db
    command:
      - "--shardsvr"
      - "--replSet"
      - "shard2"
      - "--bind_ip_all"
      - "--port"
      - "27019"

  shard2-3:
    image: mongo:8.2
    container_name: shard2-3
    restart: always
    ports:
      - "${SHARD2_3_PORT:-27039}:27019"
    networks:
      app-network:
    volumes:
      - shard2-3-data:/data/db
    command:
      - "--shardsvr"
      - "--replSet"
      - "shard2"
      - "--bind_ip_all"
      - "--port"
      - "27019"

  mongos_router:
    image: mongo:8.2
    container_name: mongos_router
    restart: always
    ports:
      - "${MONGOS_PORT:-27020}:27020"
    networks:
      app-network:
    depends_on:
      - configSrv1
      - configSrv2
      - configSrv3
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3
    command:
      - "mongos"
      - "--configdb"
      - "config_server/configSrv1:27017,configSrv2:27017,configSrv3:27017"
      - "--bind_ip_all"
      - "--port"
      - "27020"

  pymongo_api:
    image: kazhem/pymongo_api:1.0.0
    container_name: pymongo_api
    depends_on:
      - mongos_router
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      app-network:
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"

networks:
  app-network:
    driver: bridge

volumes:
  config-data1:
  config-data2:
  config-data3:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:
